---
name: Verify & Security

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install lint tools
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        working-directory: ./backend
        run: ruff check .

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: recipes_test
          MYSQL_USER: recipes
          MYSQL_PASSWORD: recipspass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+mysqlconnector://recipes:recipspass@localhost:3306/recipes_test
          SECRET_KEY: test-secret
          MEDIA_ROOT: /tmp/media-test
        run: |
          pytest -q || true

  security-sast-python:
    name: Python SAST & Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install security tools
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit security lint
        working-directory: ./backend
        run: |
          bandit -q -r . || true

      - name: Ruff lint
        working-directory: ./backend
        run: |
          pip install ruff && ruff check . || true

      - name: Dependency audit
        working-directory: ./backend
        run: |
          pip-audit -r requirements.txt || true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security-sast-python"
          upload: true

  security-secrets:
    name: Secrets & Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

      - name: Build backend image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: recipe-app-backend:${{ github.sha }}

      - name: Trivy backend vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: recipe-app-backend:${{ github.sha }}
          scanners: "vuln"
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Trivy backend image secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: recipe-app-backend:${{ github.sha }}
          scanners: "secret"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          skip-dirs: "/opt/venv/lib/python3.14/site-packages/yt_dlp/extractor"

      - name: Build frontend image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: recipe-app-frontend:${{ github.sha }}

      - name: Trivy frontend vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: recipe-app-frontend:${{ github.sha }}
          scanners: "vuln"
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Trivy frontend image secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: recipe-app-frontend:${{ github.sha }}
          scanners: "secret"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy backend scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-backend.sarif"
          category: "trivy-backend"

      - name: Upload Trivy frontend scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "trivy-frontend"

  yaml-validate:
    name: YAML & Compose Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: ".github/workflows docker-compose.yml"
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              truthy: disable
              document-start: disable

  frontend-validate:
    name: Frontend Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate frontend HTML
        run: |
          test -f frontend/src/index.html
          grep -q "<!DOCTYPE html>" frontend/src/index.html
          grep -q "<title>WhiskFul" frontend/src/index.html
          grep -q "Extract recipe from video" frontend/src/index.html
          grep -q "Extract recipe from file" frontend/src/index.html
          grep -q "Edit recipe" frontend/src/index.html

      - name: Validate frontend JavaScript
        run: |
          sed -n '/<script>/,/<\/script>/p' frontend/src/index.html | sed '1d;$d' > /tmp/recipe-app.js
          node --check /tmp/recipe-app.js

  guard:
    name: Guard
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, security-sast-python, security-secrets, yaml-validate, frontend-validate]
    steps:
      - name: Confirm dependent checks completed
        run: echo "All required checks completed."
